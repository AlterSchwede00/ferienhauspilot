<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173e38"><title>FerienhausPilot · Testversion</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#18332e;background:#f3f6f4}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1050px;margin:auto;padding:18px 16px 90px}.top{background:#173e38;color:white;padding:20px;border-radius:0 0 24px 24px}.topin{max-width:1050px;margin:auto}.brand{font-size:23px;font-weight:800;letter-spacing:-.6px}.sub{opacity:.8;font-size:13px;margin-top:4px}.nav{display:flex;gap:7px;overflow:auto;padding-top:18px}.nav button{border:0;border-radius:12px;padding:11px 15px;white-space:nowrap;background:#ffffff24;color:white;font-weight:650}.nav button.active{background:white;color:#173e38}.card{background:white;border:1px solid #e1e9e5;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 15px #173e3808}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:#657a73;font-size:13px}.pill{display:inline-block;background:#e3f3e9;color:#196b47;border-radius:20px;padding:6px 10px;font-size:12px;font-weight:700}.danger{background:#fce9e8;color:#a52e2b}.btn{border:0;background:#176a51;color:white;border-radius:11px;padding:12px 16px;font-weight:700}.btn.secondary{background:#eaf1ee;color:#1a5141}.btn.red{background:#b63735}.btn:disabled{opacity:.4;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{background:#f0f6f2;padding:16px;border-radius:13px}.stat strong{font-size:26px;display:block;margin:5px 0}h1{font-size:25px;margin:14px 0 8px}h2{font-size:19px;margin:4px 0 12px}h3{font-size:16px;margin:0 0 10px}label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}input,textarea,select{width:100%;border:1px solid #cbd9d2;border-radius:10px;padding:12px;background:#fff;color:#18332e}textarea{min-height:75px;resize:vertical}.item{padding:14px 0;border-top:1px solid #edf0ee}.item:first-child{border-top:0}.actions{display:flex;gap:8px;margin:10px 0}.actions button{flex:1;padding:11px 5px;border:1px solid #d8e3dc;border-radius:10px;background:#f7faf8;color:#395d4e;font-weight:700}.actions button.ok{background:#dcf5e8;border-color:#55b889;color:#126c48}.actions button.bad{background:#ffebea;border-color:#e58b87;color:#aa2927}.progress{height:9px;border-radius:10px;background:#e3e9e5;overflow:hidden}.progress>div{height:100%;background:#258f67;transition:width .2s}.thumb{max-width:110px;max-height:100px;border-radius:8px;margin:7px 7px 0 0;object-fit:cover}.notice{background:#fff7e6;border:1px solid #f3d7a1;border-radius:12px;padding:12px;font-size:13px}.empty{padding:25px;text-align:center;color:#647970}.small{font-size:12px}.foot{margin:25px 0;text-align:center;color:#6a7d76;font-size:12px}.report-item{padding:8px 0;border-bottom:1px solid #eee}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.hidden{display:none!important}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.shell{padding-top:25px}.card{padding:24px}}@media print{.top,.no-print,.foot{display:none!important}.shell{padding:0}.card{box-shadow:none;border:0;margin:0;padding:0}.printonly{display:block!important}body{background:white}h1{font-size:22px}.report-item{break-inside:avoid}}
</style></head><body><header class="top no-print"><div class="topin"><div class="brand">⌂ FerienhausPilot <span style="font-size:12px;font-weight:500;opacity:.8">BETA 0.1</span></div><div class="sub">Dein Ferienhaus. Immer im Blick.</div><nav class="nav" id="nav"><button data-page="dashboard" class="active">Übersicht</button><button data-page="properties">Immobilien</button><button data-page="inspection">Kontrolle</button><button data-page="reports">Berichte</button><button data-page="settings">Daten & Backup</button></nav></div></header><main class="shell" id="app"></main><footer class="foot no-print">Kostenlose lokale Testversion · Keine Cloud · Keine Anmeldung</footer><script>
(()=>{'use strict';const KEY='ferienhauspilot_v01';const groups={'Gebäude & Sicherheit':['Fenster und Türen','Schlösser und Zugänge','Dach und Fassade','Rauchmelder'],'Heizung & Wasser':['Heizungsanlage','Wasserleitungen und Armaturen','Sichtprüfung auf Undichtigkeiten','Raumtemperatur'],'Innenräume':['Küche und Geräte','Badezimmer und WC','Feuchtigkeit und Gerüche','Allgemeiner Zustand'],'Außenbereich':['Garten und Wege','Terrasse und Gartenmöbel','Mülltonnen','Sichtprüfung auf Sturmschäden']};const items=Object.values(groups).flat();const initial=()=>({properties:[{id:'villa-lotta',name:'Villa Lotta',location:'Virserum, Småland',owner:'',notes:''}],reports:[],draft:null});let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial();if(!Array.isArray(data.properties)||!Array.isArray(data.reports))throw Error()}catch{data=initial()}let page='dashboard',selected=data.properties[0]?.id||'',openReport=null;const app=document.querySelector('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('Speicherplatz voll oder Browser-Speicherung blockiert. Bitte Backup exportieren und Fotos reduzieren.');return false}};const prop=id=>data.properties.find(p=>p.id===id);const date=d=>new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});const today=()=>new Date().toISOString().slice(0,10);const btn=(label,action,extra='')=>`<button class="btn ${extra}" data-action="${action}">${label}</button>`;const box=(content)=>`<section class="card">${content}</section>`;const statusName=s=>s==='ok'?'In Ordnung':s==='bad'?'Mangel':'Nicht geprüft';const count=r=>items.filter(i=>r.checks?.[i]?.status).length;const bad=r=>items.filter(i=>r.checks?.[i]?.status==='bad').length;const current=()=>data.draft;function newDraft(){if(!selected||!prop(selected))return alert('Bitte zuerst eine Immobilie anlegen.');if(data.draft&&!confirm('Aktuellen Entwurf verwerfen und neue Kontrolle starten?'))return;data.draft={id:uid(),propertyId:selected,createdAt:new Date().toISOString(),date:today(),inspector:'Toby',checks:{},temperature:'',meter:'',summary:''};save();page='inspection';render()}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='dashboard')dashboard();if(page==='properties')properties();if(page==='inspection')inspection();if(page==='reports')reports();if(page==='settings')settings()}
function dashboard(){const last=[...data.reports].sort((a,b)=>b.createdAt.localeCompare(a.createdAt))[0];app.innerHTML=`<h1>Willkommen bei FerienhausPilot</h1><p class="muted">Alle Immobilien und Kontrollen auf einen Blick.</p><div class="grid"><div class="stat"><span class="muted">Immobilien</span><strong>${data.properties.length}</strong></div><div class="stat"><span class="muted">Berichte</span><strong>${data.reports.length}</strong></div><div class="stat"><span class="muted">Erfasste Mängel</span><strong>${data.reports.reduce((n,r)=>n+bad(r),0)}</strong></div><div class="stat"><span class="muted">Letzte Kontrolle</span><strong style="font-size:17px">${last?date(last.date):'Noch keine'}</strong></div></div>${box(`<h2>Neue Hauskontrolle</h2><label>Immobilie auswählen</label><select id="dash-property">${data.properties.map(p=>`<option value="${esc(p.id)}" ${p.id===selected?'selected':''}>${esc(p.name)} – ${esc(p.location)}</option>`).join('')}</select><p>${btn('Kontrolle starten','new')}</p>`)}${box(`<h2>Letzte Berichte</h2>${last?data.reports.slice(-3).reverse().map(r=>`<div class="item row"><div><strong>${esc(prop(r.propertyId)?.name||'Gelöschtes Objekt')}</strong><div class="muted">${date(r.date)} · ${count(r)}/${items.length} geprüft · ${bad(r)} Mängel</div></div><button class="btn secondary" data-open="${esc(r.id)}">Ansehen</button></div>`).join(''):'<div class="empty">Noch keine Berichte gespeichert.</div>'}`)}<div class="notice">🔒 Alle Daten bleiben in diesem Browser auf diesem Gerät. Bitte regelmäßig ein Backup exportieren.</div>`;document.querySelector('#dash-property')?.addEventListener('change',e=>selected=e.target.value)}
function properties(){app.innerHTML=`<h1>Immobilienverwaltung</h1>${data.properties.map(p=>box(`<div class="row"><h2>${esc(p.name)}</h2><span class="pill">Objekt</span></div><div class="muted">${esc(p.location)}</div><label>Name des Ferienhauses</label><input data-field="name" data-pid="${esc(p.id)}" value="${esc(p.name)}"><label>Ort / Adresse</label><input data-field="location" data-pid="${esc(p.id)}" value="${esc(p.location)}"><label>Eigentümer / Kontakt</label><input data-field="owner" data-pid="${esc(p.id)}" value="${esc(p.owner)}"><label>Objekthinweise (keine Schlüsselcodes oder Passwörter)</label><textarea data-field="notes" data-pid="${esc(p.id)}">${esc(p.notes)}</textarea><p class="toolbar"><button class="btn secondary" data-saveprop="${esc(p.id)}">Änderungen speichern</button><button class="btn red" data-delprop="${esc(p.id)}">Entfernen</button></p>`)).join('')}${box(`<h2>Neue Immobilie</h2><label>Name</label><input id="new-name" placeholder="z. B. Ferienhaus am See"><label>Ort</label><input id="new-location" placeholder="z. B. Virserum"><p>${btn('Immobilie hinzufügen','add-property')}</p>`)}`}
function inspection(){const r=current();if(!r){app.innerHTML=`<h1>Digitale Hauskontrolle</h1>${box(`<p>Du hast noch keine aktive Kontrolle.</p><label>Immobilie</label><select id="inspect-property">${data.properties.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select><p>${btn('Neue Kontrolle starten','new')}</p>`)}`;document.querySelector('#inspect-property')?.addEventListener('change',e=>selected=e.target.value);return}const p=prop(r.propertyId);app.innerHTML=`<h1>Kontrolle: ${esc(p?.name||'Objekt')}</h1><div class="muted">${esc(p?.location||'')} · Entwurf wird automatisch gespeichert</div>${box(`<div class="row"><strong>Fortschritt</strong><strong>${count(r)} / ${items.length}</strong></div><div class="progress" style="margin:12px 0"><div style="width:${count(r)/items.length*100}%"></div></div><div class="row"><span class="pill">${count(r)-bad(r)} in Ordnung</span><span class="pill ${bad(r)?'danger':''}">${bad(r)} Mängel</span></div><label>Kontrolldatum</label><input type="date" data-draft="date" value="${esc(r.date)}"><label>Betreuer</label><input data-draft="inspector" value="${esc(r.inspector)}">`)}${Object.entries(groups).map(([group,list])=>box(`<h2>${esc(group)}</h2>${list.map(item=>{const v=r.checks[item]||{};return `<div class="item"><strong>${esc(item)}</strong><div class="actions"><button class="${v.status==='ok'?'ok':''}" data-status="ok" data-item="${esc(item)}">✓ In Ordnung</button><button class="${v.status==='bad'?'bad':''}" data-status="bad" data-item="${esc(item)}">⚠ Mangel</button></div>${v.status==='bad'?`<label>Schaden / empfohlene Maßnahme</label><textarea data-note="${esc(item)}" placeholder="Mangel beschreiben …">${esc(v.note||'')}</textarea><label>Foto hinzufügen (wird lokal verkleinert gespeichert)</label><input type="file" accept="image/*" capture="environment" data-photo="${esc(item)}">${v.photo?`<div><img class="thumb" src="${v.photo}" alt="Schadensfoto"><button class="btn secondary" data-removephoto="${esc(item)}">Foto entfernen</button></div>`:''}`:''}</div>`}).join('')}`)).join('')}${box(`<h2>Messwerte & Abschluss</h2><label>Raumtemperatur (°C)</label><input type="number" step="0.1" data-draft="temperature" value="${esc(r.temperature)}"><label>Stromzählerstand (kWh)</label><input type="number" step="1" data-draft="meter" value="${esc(r.meter)}"><label>Allgemeine Bemerkungen</label><textarea data-draft="summary">${esc(r.summary)}</textarea><p class="muted">Zum Abschluss müssen alle 16 Prüfpunkte bewertet und alle Mängel beschrieben sein.</p><div class="toolbar">${btn('Bericht abschließen','finish')}${btn('Entwurf verwerfen','discard','red')}</div>`)}`}
function reports(){if(openReport){const r=data.reports.find(x=>x.id===openReport);if(!r){openReport=null;return reports()}const p=prop(r.propertyId);app.innerHTML=`<div class="no-print toolbar"><button class="btn secondary" data-action="back-reports">← Zurück</button><button class="btn" data-action="print">Drucken / Als PDF sichern</button><button class="btn secondary" data-action="text-export">Text herunterladen</button></div>${box(`<div class="row"><h1>Kontrollbericht</h1><span class="pill">Abgeschlossen</span></div><h2>${esc(r.propertyName||p?.name||'Ferienhaus')}</h2><p class="muted">${esc(r.propertyLocation||p?.location||'')}<br>${date(r.date)} · Betreuer: ${esc(r.inspector)}</p><div class="grid"><div class="stat">Prüfpunkte<strong>${count(r)}/${items.length}</strong></div><div class="stat">Mängel<strong>${bad(r)}</strong></div><div class="stat">Temperatur<strong>${esc(r.temperature||'–')} °C</strong></div><div class="stat">Stromzähler<strong>${esc(r.meter||'–')}</strong></div></div>${Object.entries(groups).map(([g,list])=>`<h3 style="margin-top:22px">${esc(g)}</h3>${list.map(i=>{const v=r.checks[i]||{};return `<div class="report-item"><strong>${esc(i)}</strong> – ${esc(statusName(v.status))}${v.note?`<div class="muted">${esc(v.note)}</div>`:''}${v.photo?`<div><img class="thumb" src="${v.photo}" alt="Dokumentationsfoto"></div>`:''}</div>`}).join('')}`).join('')}<h3 style="margin-top:20px">Allgemeine Bemerkungen</h3><p>${esc(r.summary||'Keine')}</p><div class="no-print toolbar"><button class="btn red" data-delete="${esc(r.id)}">Bericht löschen</button></div>`)}`;return}app.innerHTML=`<h1>Gespeicherte Berichte</h1>${data.reports.length?data.reports.slice().reverse().map(r=>box(`<div class="row"><div><h2>${esc(r.propertyName||prop(r.propertyId)?.name||'Ferienhaus')}</h2><div class="muted">${date(r.date)} · ${esc(r.inspector)}<br>${count(r)}/${items.length} Prüfpunkte · ${bad(r)} Mängel</div></div><button class="btn secondary" data-open="${esc(r.id)}">Öffnen</button></div>`)).join(''):'<div class="card empty">Noch keine abgeschlossenen Kontrollberichte vorhanden.</div>'}`}
function settings(){app.innerHTML=`<h1>Daten & Backup</h1>${box(`<h2>Datensicherung</h2><p>Exportiere alle Immobilien, Berichte und Fotos als JSON-Datei. Diese Datei kannst du später wieder importieren.</p><div class="toolbar">${btn('Backup herunterladen','backup')}<label style="margin:0" class="btn secondary">Backup importieren<input id="import" type="file" accept="application/json,.json" style="display:none"></label></div><p class="muted">Beim Import werden die bisherigen Daten auf diesem Gerät ersetzt.</p>`)}${box(`<h2>Lokaler Testbetrieb</h2><p>Speicherung erfolgt ausschließlich über localStorage. Das ist praktisch für einen Prototyp, aber nicht zuverlässig genug für produktive Kundendaten. Safari kann lokale Daten bei Speicherbereinigung oder eingeschränktem Dateizugriff löschen.</p><p><strong>Wichtig:</strong> Keine echten Schlüsselcodes, Zugangsdaten oder sensiblen Kundendaten eintragen.</p>${btn('Alle Testdaten löschen','reset','red')}`)}`}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}function textReport(r){return `FERIENHAUSPILOT – KONTROLLBERICHT\n${r.propertyName}\n${r.propertyLocation}\nDatum: ${r.date}\nBetreuer: ${r.inspector}\n\n`+Object.entries(groups).map(([g,list])=>g+'\n'+list.map(i=>{const v=r.checks[i]||{};return '- '+i+': '+statusName(v.status)+(v.note?' | '+v.note:'')}).join('\n')).join('\n\n')+`\n\nTemperatur: ${r.temperature||'–'} °C\nStromzähler: ${r.meter||'–'}\nBemerkungen: ${r.summary||'Keine'}`}
async function photo(file,item){if(!file)return;if(file.size>15*1024*1024)return alert('Bild zu groß (max. 15 MB).');try{const img=new Image(),url=URL.createObjectURL(file);await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});const scale=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const base64=c.toDataURL('image/jpeg',.65);data.draft.checks[item]??={status:'bad'};data.draft.checks[item].photo=base64;if(save())render()}catch{alert('Das Foto konnte nicht verarbeitet werden.')}}
app.addEventListener('change',async e=>{const t=e.target;if(t.dataset.draft){data.draft[t.dataset.draft]=t.value;save()}if(t.dataset.note){data.draft.checks[t.dataset.note].note=t.value;save()}if(t.dataset.photo){await photo(t.files?.[0],t.dataset.photo)}if(t.id==='import'){const f=t.files?.[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(!Array.isArray(parsed.properties)||!Array.isArray(parsed.reports))throw Error();if(confirm('Vorhandene Daten durch dieses Backup ersetzen?')){data=parsed;selected=data.properties[0]?.id||'';openReport=null;save();page='dashboard';render()}}catch{alert('Ungültige Backup-Datei.')}}});app.addEventListener('input',e=>{const t=e.target;if(t.dataset.draft){data.draft[t.dataset.draft]=t.value;save()}if(t.dataset.note){data.draft.checks[t.dataset.note].note=t.value;save()}});app.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.open){openReport=t.dataset.open;page='reports';render();return}if(t.dataset.status){const i=t.dataset.item,v=data.draft.checks[i]||{};v.status=t.dataset.status;data.draft.checks[i]=v;save();render();return}if(t.dataset.removephoto){delete data.draft.checks[t.dataset.removephoto].photo;save();render();return}if(t.dataset.saveprop){const p=prop(t.dataset.saveprop);app.querySelectorAll(`[data-pid="${CSS.escape(p.id)}"]`).forEach(el=>p[el.dataset.field]=el.value);save();render();return}if(t.dataset.delprop){const id=t.dataset.delprop;if(data.reports.some(r=>r.propertyId===id)||data.draft?.propertyId===id)return alert('Zu diesem Objekt existieren Berichte oder ein Entwurf. Bitte diese zuerst entfernen.');if(confirm('Immobilie entfernen?')){data.properties=data.properties.filter(p=>p.id!==id);selected=data.properties[0]?.id||'';save();render()}return}if(t.dataset.delete){if(confirm('Diesen Bericht unwiderruflich löschen?')){data.reports=data.reports.filter(r=>r.id!==t.dataset.delete);openReport=null;save();render()}return}switch(t.dataset.action){case 'new':newDraft();break;case 'add-property':{const name=document.querySelector('#new-name').value.trim(),location=document.querySelector('#new-location').value.trim();if(!name)return alert('Bitte einen Namen eingeben.');const p={id:uid(),name,location,owner:'',notes:''};data.properties.push(p);selected=p.id;save();render();break}case 'finish':{const r=data.draft;if(count(r)!==items.length)return alert('Bitte alle 16 Prüfpunkte bearbeiten.');if(items.some(i=>r.checks[i]?.status==='bad'&&!r.checks[i]?.note?.trim()))return alert('Bitte jeden Mangel beschreiben.');if(!confirm('Kontrollbericht abschließen und lokal speichern?'))return;const p=prop(r.propertyId);r.propertyName=p?.name||'';r.propertyLocation=p?.location||'';r.finishedAt=new Date().toISOString();data.reports.push(r);data.draft=null;openReport=r.id;save();page='reports';render();break}case 'discard':if(confirm('Entwurf wirklich verwerfen?')){data.draft=null;save();render()}break;case 'back-reports':openReport=null;render();break;case 'print':window.print();break;case 'text-export':{const r=data.reports.find(x=>x.id===openReport);download('Kontrollbericht-'+r.date+'.txt',textReport(r),'text/plain;charset=utf-8');break}case 'backup':download('FerienhausPilot-Backup-'+today()+'.json',JSON.stringify(data,null,2),'application/json');break;case 'reset':if(confirm('Wirklich ALLE lokalen Testdaten löschen?')&&confirm('Letzte Bestätigung: Daten unwiderruflich löschen?')){data=initial();selected='villa-lotta';openReport=null;save();page='dashboard';render()}break}});document.querySelector('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;openReport=null;render()});render()})();
</script></body></html>
