<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173e38"><title>FerienhausPilot · Beta 0.3</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#142d43;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1050px;margin:auto;padding:18px 16px 90px}.top{background:#142d43;color:white;padding:20px;border-radius:0 0 24px 24px}.topin{max-width:1050px;margin:auto}.brand{font-size:23px;font-weight:800;letter-spacing:-.6px}.sub{opacity:.8;font-size:13px;margin-top:4px}.nav{display:flex;gap:7px;overflow:auto;padding-top:18px}.nav button{border:0;border-radius:12px;padding:11px 15px;white-space:nowrap;background:#ffffff24;color:white;font-weight:650}.nav button.active{background:white;color:#142d43}.card{background:white;border:1px solid #e1e9e5;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 15px #173e3808}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.muted{color:#657a73;font-size:13px}.pill{display:inline-block;background:#e3f3e9;color:#196b47;border-radius:20px;padding:6px 10px;font-size:12px;font-weight:700}.danger{background:#fce9e8;color:#a52e2b}.btn{border:0;background:#167858;color:white;border-radius:11px;padding:12px 16px;font-weight:700}.btn.secondary{background:#eaf1ee;color:#1a5141}.btn.red{background:#b63735}.btn:disabled{opacity:.4;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{background:#f0f6f2;padding:16px;border-radius:13px}.stat strong{font-size:26px;display:block;margin:5px 0}h1{font-size:25px;margin:14px 0 8px}h2{font-size:19px;margin:4px 0 12px}h3{font-size:16px;margin:0 0 10px}label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}input,textarea,select{width:100%;border:1px solid #cbd9d2;border-radius:10px;padding:12px;background:#fff;color:#18332e}textarea{min-height:75px;resize:vertical}.item{padding:14px 0;border-top:1px solid #edf0ee}.item:first-child{border-top:0}.actions{display:flex;gap:8px;margin:10px 0}.actions button{flex:1;padding:11px 5px;border:1px solid #d8e3dc;border-radius:10px;background:#f7faf8;color:#395d4e;font-weight:700}.actions button.ok{background:#dcf5e8;border-color:#55b889;color:#126c48}.actions button.bad{background:#ffebea;border-color:#e58b87;color:#aa2927}.progress{height:9px;border-radius:10px;background:#e3e9e5;overflow:hidden}.progress>div{height:100%;background:#258f67;transition:width .2s}.thumb{max-width:110px;max-height:100px;border-radius:8px;margin:7px 7px 0 0;object-fit:cover}.notice{background:#fff7e6;border:1px solid #f3d7a1;border-radius:12px;padding:12px;font-size:13px}.empty{padding:25px;text-align:center;color:#647970}.small{font-size:12px}.foot{margin:25px 0;text-align:center;color:#6a7d76;font-size:12px}.report-item{padding:8px 0;border-bottom:1px solid #eee}.toolbar{display:flex;flex-wrap:wrap;gap:8px}.hidden{display:none!important}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.shell{padding-top:25px}.card{padding:24px}}@media print{.top,.no-print,.foot{display:none!important}.shell{padding:0}.card{box-shadow:none;border:0;margin:0;padding:0}.printonly{display:block!important}body{background:white}h1{font-size:22px}.report-item{break-inside:avoid}}

/* Version 0.3: polished mobile interface and printable report */
.top{background:linear-gradient(125deg,#10283e,#1c5262);box-shadow:0 8px 25px #10283e20}.brand{letter-spacing:-.8px}.card{border-color:#e1e8ee;box-shadow:0 7px 24px #12344b0a}.stat{background:#edf5f8}.btn{transition:filter .15s,transform .15s}.btn:active{transform:scale(.98)}.btn:hover{filter:brightness(1.06)}.report-cover{padding:20px;border-radius:14px;background:linear-gradient(120deg,#10283e,#205c67);color:#fff;margin:12px 0 22px}.report-cover h1{font-size:28px}.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px;margin-top:12px}.photo-tile{border:1px solid #d9e3ea;border-radius:12px;padding:7px;background:#f7fafc}.photo-tile img{width:100%;height:120px;object-fit:cover;border-radius:8px}.photo-tile button{font-size:12px;margin-top:5px;padding:7px;width:100%}.photo-caption{font-size:12px;overflow-wrap:anywhere}.report-photo{width:210px;max-height:170px;object-fit:contain;border:1px solid #dce3e9;border-radius:8px;margin:6px 6px 3px 0}.hint{font-size:12px;color:#526b7b}.section-title{border-bottom:2px solid #dcebe9;padding-bottom:8px}@media print{@page{size:A4;margin:14mm}.report-cover{print-color-adjust:exact;-webkit-print-color-adjust:exact}.report-photo{max-height:150px;break-inside:avoid}.report-item{page-break-inside:avoid}.nav,.no-print{display:none!important}}
</style></head><body><header class="top no-print"><div class="topin"><div class="brand">⌂ FerienhausPilot <span style="font-size:12px;font-weight:500;opacity:.8">BETA 0.3</span></div><div class="sub">Dein Ferienhaus. Immer im Blick.</div><nav class="nav" id="nav"><button data-page="dashboard" class="active">Übersicht</button><button data-page="properties">Immobilien</button><button data-page="inspection">Kontrolle</button><button data-page="reports">Berichte</button><button data-page="appointments">Termine</button><button data-page="orders">Aufträge</button><button data-page="settings">Daten & Backup</button></nav></div></header><main class="shell" id="app"></main><footer class="foot no-print">Beta 0.3 · Lokale Testdaten · Keine Cloud · Keine Anmeldung</footer><script>
(()=>{'use strict';const KEY='ferienhauspilot_v01';const groups={'Gebäude & Sicherheit':['Fenster und Türen','Schlösser und Zugänge','Dach und Fassade','Rauchmelder'],'Heizung & Wasser':['Heizungsanlage','Wasserleitungen und Armaturen','Sichtprüfung auf Undichtigkeiten','Raumtemperatur'],'Innenräume':['Küche und Geräte','Badezimmer und WC','Feuchtigkeit und Gerüche','Allgemeiner Zustand'],'Außenbereich':['Garten und Wege','Terrasse und Gartenmöbel','Mülltonnen','Sichtprüfung auf Sturmschäden']};const items=Object.values(groups).flat();const initial=()=>({properties:[{id:'villa-lotta',name:'Villa Lotta',location:'Virserum, Småland',owner:'',notes:''}],reports:[],appointments:[],orders:[],draft:null});let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial();if(!Array.isArray(data.properties)||!Array.isArray(data.reports))throw Error()}catch{data=initial()}data.appointments??=[];data.orders??=[];let page='dashboard',selected=data.properties[0]?.id||'',openReport=null;const app=document.querySelector('#app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('Speicherplatz voll oder Browser-Speicherung blockiert. Bitte Backup exportieren und Fotos reduzieren.');return false}};const prop=id=>data.properties.find(p=>p.id===id);const date=d=>{if(!d)return '–';const x=new Date(d);return isNaN(x)?String(d):x.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})};const today=()=>new Date().toISOString().slice(0,10);const btn=(label,action,extra='')=>`<button class="btn ${extra}" data-action="${action}">${label}</button>`;const box=(content)=>`<section class="card">${content}</section>`;const statusName=s=>s==='ok'?'In Ordnung':s==='bad'?'Mangel':'Nicht geprüft';const count=r=>items.filter(i=>r.checks?.[i]?.status).length;const bad=r=>items.filter(i=>r.checks?.[i]?.status==='bad').length;const current=()=>data.draft;function newDraft(){if(!selected||!prop(selected))return alert('Bitte zuerst eine Immobilie anlegen.');if(data.draft&&!confirm('Aktuellen Entwurf verwerfen und neue Kontrolle starten?'))return;data.draft={id:uid(),propertyId:selected,createdAt:new Date().toISOString(),date:today(),inspector:'Toby',checks:{},temperature:'',meter:'',summary:''};save();page='inspection';render()}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='dashboard')dashboard();if(page==='properties')properties();if(page==='inspection')inspection();if(page==='reports')reports();if(page==='settings')settings();if(page==='appointments')appointments();if(page==='orders')orders()}
function dashboard(){const last=[...data.reports].sort((a,b)=>b.createdAt.localeCompare(a.createdAt))[0];app.innerHTML=`<h1>Guten Tag! 👋</h1><p class="muted">Deine Ferienhäuser und Aufgaben im Überblick · Version 0.3</p><div class="grid"><div class="stat"><span class="muted">Immobilien</span><strong>${data.properties.length}</strong></div><div class="stat"><span class="muted">Berichte</span><strong>${data.reports.length}</strong></div><div class="stat"><span class="muted">Erfasste Mängel</span><strong>${data.reports.reduce((n,r)=>n+bad(r),0)}</strong></div><div class="stat"><span class="muted">Letzte Kontrolle</span><strong style="font-size:17px">${last?date(last.date):'Noch keine'}</strong></div></div>${box(`<h2>Neue Hauskontrolle</h2><label>Immobilie auswählen</label><select id="dash-property">${data.properties.map(p=>`<option value="${esc(p.id)}" ${p.id===selected?'selected':''}>${esc(p.name)} – ${esc(p.location)}</option>`).join('')}</select><p>${btn('Kontrolle starten','new')}</p>`)}${box(`<h2>Letzte Berichte</h2>${last?data.reports.slice(-3).reverse().map(r=>`<div class="item row"><div><strong>${esc(prop(r.propertyId)?.name||'Gelöschtes Objekt')}</strong><div class="muted">${date(r.date)} · ${count(r)}/${items.length} geprüft · ${bad(r)} Mängel</div></div><button class="btn secondary" data-open="${esc(r.id)}">Ansehen</button></div>`).join(''):'<div class="empty">Noch keine Berichte gespeichert.</div>'}`)}<div class="notice">🔒 Alle Daten bleiben in diesem Browser auf diesem Gerät. Bitte regelmäßig ein Backup exportieren.</div>`;document.querySelector('#dash-property')?.addEventListener('change',e=>selected=e.target.value)}
function properties(){app.innerHTML=`<h1>Immobilienverwaltung</h1>${data.properties.map(p=>box(`<div class="row"><h2>${esc(p.name)}</h2><span class="pill">Objekt</span></div><div class="muted">${esc(p.location)}</div><label>Name des Ferienhauses</label><input data-field="name" data-pid="${esc(p.id)}" value="${esc(p.name)}"><label>Ort / Adresse</label><input data-field="location" data-pid="${esc(p.id)}" value="${esc(p.location)}"><label>Eigentümer / Kontakt</label><input data-field="owner" data-pid="${esc(p.id)}" value="${esc(p.owner)}"><label>Objekthinweise (keine Schlüsselcodes oder Passwörter)</label><textarea data-field="notes" data-pid="${esc(p.id)}">${esc(p.notes)}</textarea><p class="toolbar"><button class="btn secondary" data-saveprop="${esc(p.id)}">Änderungen speichern</button><button class="btn red" data-delprop="${esc(p.id)}">Entfernen</button></p>`)).join('')}${box(`<h2>Neue Immobilie</h2><label>Name</label><input id="new-name" placeholder="z. B. Ferienhaus am See"><label>Ort</label><input id="new-location" placeholder="z. B. Virserum"><p>${btn('Immobilie hinzufügen','add-property')}</p>`)}`}
function photoList(v){return [...(Array.isArray(v.photos)?v.photos:[]),...(v.photo?[v.photo]:[])]}
function inspection(){const r=current();if(!r){app.innerHTML=`<h1>Digitale Hauskontrolle</h1>${box(`<p>Du hast noch keine aktive Kontrolle.</p><label>Immobilie</label><select id="inspect-property">${data.properties.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select><p>${btn('Neue Kontrolle starten','new')}</p>`)}`;document.querySelector('#inspect-property')?.addEventListener('change',e=>selected=e.target.value);return}const p=prop(r.propertyId);app.innerHTML=`<h1>Kontrolle: ${esc(p?.name||'Objekt')}</h1><div class="muted">${esc(p?.location||'')} · Entwurf wird automatisch gespeichert</div>${box(`<div class="row"><strong>Fortschritt</strong><strong>${count(r)} / ${items.length}</strong></div><div class="progress" style="margin:12px 0"><div style="width:${count(r)/items.length*100}%"></div></div><div class="row"><span class="pill">${count(r)-bad(r)} in Ordnung</span><span class="pill ${bad(r)?'danger':''}">${bad(r)} Mängel</span></div><label>Kontrolldatum</label><input type="date" data-draft="date" value="${esc(r.date)}"><label>Betreuer</label><input data-draft="inspector" value="${esc(r.inspector)}">`)}${Object.entries(groups).map(([group,list])=>box(`<h2>${esc(group)}</h2>${list.map(item=>{const v=r.checks[item]||{};return `<div class="item"><strong>${esc(item)}</strong><div class="actions"><button class="${v.status==='ok'?'ok':''}" data-status="ok" data-item="${esc(item)}">✓ In Ordnung</button><button class="${v.status==='bad'?'bad':''}" data-status="bad" data-item="${esc(item)}">⚠ Mangel</button></div>${v.status==='bad'?`<label>Schaden / empfohlene Maßnahme</label><textarea data-note="${esc(item)}" placeholder="Mangel beschreiben …">${esc(v.note||'')}</textarea><label>Schadensfotos hinzufügen (mehrere möglich)</label><input type="file" accept="image/*" multiple data-photo="${esc(item)}"><div class="hint">Auf dem iPad „Foto aufnehmen“ oder „Fotomediathek“ wählen. Bilder werden verkleinert.</div><div class="photo-grid">${photoList(v).map((ph,ix)=>`<div class="photo-tile"><img src="${ph}" alt="Schadensfoto ${ix+1}"><button class="btn secondary" data-removephoto="${esc(item)}" data-photoindex="${ix}">Entfernen</button></div>`).join('')}</div>`:''}</div>`}).join('')}`)).join('')}${box(`<h2>Messwerte & Abschluss</h2><label>Raumtemperatur (°C)</label><input type="number" step="0.1" data-draft="temperature" value="${esc(r.temperature)}"><label>Stromzählerstand (kWh)</label><input type="number" step="1" data-draft="meter" value="${esc(r.meter)}"><label>Allgemeine Bemerkungen</label><textarea data-draft="summary">${esc(r.summary)}</textarea><p class="muted">Zum Abschluss müssen alle 16 Prüfpunkte bewertet und alle Mängel beschrieben sein.</p><div class="toolbar">${btn('Bericht abschließen','finish')}${btn('Entwurf verwerfen','discard','red')}</div>`)}`}
function reports(){if(openReport){const r=data.reports.find(x=>x.id===openReport);if(!r){openReport=null;return reports()}const p=prop(r.propertyId);app.innerHTML=`<div class="no-print toolbar"><button class="btn secondary" data-action="back-reports">← Zurück</button><button class="btn" data-action="print">Drucken / Als PDF sichern</button><button class="btn secondary" data-action="text-export">Text herunterladen</button></div>${box(`<div class="report-cover"><div style="font-size:12px;letter-spacing:2px">⌂ FERIENHAUSPILOT · KONTROLLDOKUMENTATION</div><h1>Kontrollbericht</h1><h2>${esc(r.propertyName||p?.name||'Ferienhaus')}</h2><div>${esc(r.propertyLocation||p?.location||'')} · ${date(r.date)}</div><div style="margin-top:8px;font-size:13px">Kontrolliert durch ${esc(r.inspector)}</div></div><div class="grid"><div class="stat">Prüfpunkte<strong>${count(r)}/${items.length}</strong></div><div class="stat">Mängel<strong>${bad(r)}</strong></div><div class="stat">Temperatur<strong>${esc(r.temperature||'–')} °C</strong></div><div class="stat">Stromzähler<strong>${esc(r.meter||'–')}</strong></div></div>${Object.entries(groups).map(([g,list])=>`<h3 style="margin-top:22px">${esc(g)}</h3>${list.map(i=>{const v=r.checks[i]||{};return `<div class="report-item"><strong>${esc(i)}</strong> – ${esc(statusName(v.status))}${v.note?`<div class="muted">${esc(v.note)}</div>`:''}${photoList(v).length?`<div>${photoList(v).map((ph,ix)=>`<img class="report-photo" src="${ph}" alt="Dokumentationsfoto ${ix+1}">`).join('')}</div>`:''}</div>`}).join('')}`).join('')}<h3 style="margin-top:20px">Allgemeine Bemerkungen</h3><p>${esc(r.summary||'Keine')}</p><p class="muted">Dokumentiert mit FerienhausPilot · Erstellt am ${date(r.finishedAt||r.date)}</p><div class="no-print toolbar"><button class="btn red" data-delete="${esc(r.id)}">Bericht löschen</button></div>`)}`;return}app.innerHTML=`<h1>Gespeicherte Berichte</h1>${data.reports.length?data.reports.slice().reverse().map(r=>box(`<div class="row"><div><h2>${esc(r.propertyName||prop(r.propertyId)?.name||'Ferienhaus')}</h2><div class="muted">${date(r.date)} · ${esc(r.inspector)}<br>${count(r)}/${items.length} Prüfpunkte · ${bad(r)} Mängel</div></div><button class="btn secondary" data-open="${esc(r.id)}">Öffnen</button></div>`)).join(''):'<div class="card empty">Noch keine abgeschlossenen Kontrollberichte vorhanden.</div>'}`}
function appointments(){const sorted=[...data.appointments].sort((a,b)=>a.date.localeCompare(b.date));app.innerHTML=`<h1>Terminplanung</h1><p class="muted">Hauskontrollen und geplante Einsätze verwalten.</p>${box(`<h2>Neuen Termin anlegen</h2><label>Immobilie</label><select id="appointment-property">${data.properties.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select><label>Datum</label><input id="appointment-date" type="date" value="${today()}"><label>Uhrzeit</label><input id="appointment-time" type="time" value="10:00"><label>Aufgabe</label><input id="appointment-title" placeholder="z. B. Winterkontrolle"><label>Notizen</label><textarea id="appointment-notes" placeholder="Was ist zu erledigen?"></textarea><p>${btn('Termin speichern','add-appointment')}</p>`)}${box(`<h2>Geplante Termine (${sorted.length})</h2>${sorted.length?sorted.map(a=>`<div class="item"><div class="row"><div><strong>${esc(a.title)}</strong><div class="muted">${esc(prop(a.propertyId)?.name||'Objekt')} · ${esc(a.date)} · ${esc(a.time||'')}</div></div><span class="pill ${a.done?'':'danger'}">${a.done?'Erledigt':'Geplant'}</span></div>${a.notes?`<p class="muted">${esc(a.notes)}</p>`:''}<div class="toolbar"><button class="btn secondary" data-apptdone="${esc(a.id)}">${a.done?'Wieder öffnen':'Erledigt'}</button><button class="btn red" data-apptdelete="${esc(a.id)}">Löschen</button></div></div>`).join(''):'<div class="empty">Noch keine Termine vorhanden.</div>'}`)}`}
function orders(){const total=data.orders.reduce((n,o)=>n+(Number(o.price)||0),0);app.innerHTML=`<h1>Auftragsverwaltung</h1><p class="muted">Reparaturen, Reinigung, Gartenpflege und andere Dienstleistungen.</p>${box(`<h2>Auftrag erfassen</h2><label>Immobilie</label><select id="order-property">${data.properties.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select><label>Auftrag</label><input id="order-title" placeholder="z. B. Wasserhahn reparieren"><label>Kategorie</label><select id="order-category"><option>Reparatur</option><option>Reinigung</option><option>Gartenpflege</option><option>Hauskontrolle</option><option>Sonstiges</option></select><label>Geplanter Preis (SEK)</label><input id="order-price" type="number" min="0" step="0.01" placeholder="0"><label>Beschreibung</label><textarea id="order-notes"></textarea><p>${btn('Auftrag speichern','add-order')}</p>`)}${box(`<h2>Aufträge (${data.orders.length})</h2><p class="muted">Summe der erfassten geplanten Preise: ${total.toLocaleString('sv-SE')} SEK (keine Rechnung)</p>${data.orders.length?data.orders.slice().reverse().map(o=>`<div class="item"><div class="row"><div><strong>${esc(o.title)}</strong><div class="muted">${esc(prop(o.propertyId)?.name||'Objekt')} · ${esc(o.category)} · ${Number(o.price||0).toLocaleString('sv-SE')} SEK</div></div><span class="pill ${o.done?'':'danger'}">${o.done?'Erledigt':'Offen'}</span></div>${o.notes?`<p class="muted">${esc(o.notes)}</p>`:''}<div class="toolbar"><button class="btn secondary" data-orderdone="${esc(o.id)}">${o.done?'Wieder öffnen':'Erledigt'}</button><button class="btn red" data-orderdelete="${esc(o.id)}">Löschen</button></div></div>`).join(''):'<div class="empty">Noch keine Aufträge vorhanden.</div>'}`)}`}
function settings(){app.innerHTML=`<h1>Daten & Backup</h1>${box(`<h2>Datensicherung</h2><p>Exportiere alle Immobilien, Berichte und Fotos als JSON-Datei. Diese Datei kannst du später wieder importieren.</p><div class="toolbar">${btn('Backup herunterladen','backup')}<label style="margin:0" class="btn secondary">Backup importieren<input id="import" type="file" accept="application/json,.json" style="display:none"></label></div><p class="muted">Beim Import werden die bisherigen Daten auf diesem Gerät ersetzt. Vor jedem Update bitte Backup herunterladen.</p>`)}${box(`<h2>Lokaler Testbetrieb</h2><p>Speicherung erfolgt ausschließlich über localStorage. Mehrere Fotos können das Speicherlimit schnell erreichen; sichere regelmäßig und reduziere bei Bedarf die Anzahl der Bilder. Das ist praktisch für einen Prototyp, aber nicht zuverlässig genug für produktive Kundendaten. Safari kann lokale Daten bei Speicherbereinigung oder eingeschränktem Dateizugriff löschen.</p><p><strong>Wichtig:</strong> Keine echten Schlüsselcodes, Zugangsdaten oder sensiblen Kundendaten eintragen.</p>${btn('Alle Testdaten löschen','reset','red')}`)}`}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}function textReport(r){return `FERIENHAUSPILOT – KONTROLLBERICHT\n${r.propertyName}\n${r.propertyLocation}\nDatum: ${r.date}\nBetreuer: ${r.inspector}\n\n`+Object.entries(groups).map(([g,list])=>g+'\n'+list.map(i=>{const v=r.checks[i]||{};return '- '+i+': '+statusName(v.status)+(v.note?' | '+v.note:'')}).join('\n')).join('\n\n')+`\n\nTemperatur: ${r.temperature||'–'} °C\nStromzähler: ${r.meter||'–'}\nBemerkungen: ${r.summary||'Keine'}`}
async function photo(files,item){const list=Array.from(files||[]);if(!list.length)return;const v=data.draft.checks[item]??={status:'bad'};v.photos??=[];if(v.photo){v.photos.unshift(v.photo);delete v.photo}if(v.photos.length+list.length>8)return alert('Maximal 8 Fotos pro Prüfpunkt.');for(const file of list){if(file.size>15*1024*1024){alert('Ein Bild ist zu groß (maximal 15 MB).');continue}try{const img=new Image(),url=URL.createObjectURL(file);await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});const scale=Math.min(1,850/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);v.photos.push(c.toDataURL('image/jpeg',.58))}catch{alert('Ein Foto konnte nicht verarbeitet werden.')}}data.draft.checks[item]=v;if(save())render()}
app.addEventListener('change',async e=>{const t=e.target;if(t.dataset.draft){data.draft[t.dataset.draft]=t.value;save()}if(t.dataset.note){data.draft.checks[t.dataset.note].note=t.value;save()}if(t.dataset.photo){await photo(t.files,t.dataset.photo)}if(t.id==='import'){const f=t.files?.[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(!Array.isArray(parsed.properties)||!Array.isArray(parsed.reports))throw Error();if(confirm('Vorhandene Daten durch dieses Backup ersetzen?')){data=parsed;selected=data.properties[0]?.id||'';openReport=null;save();page='dashboard';render()}}catch{alert('Ungültige Backup-Datei.')}}});app.addEventListener('input',e=>{const t=e.target;if(t.dataset.draft){data.draft[t.dataset.draft]=t.value;save()}if(t.dataset.note){data.draft.checks[t.dataset.note].note=t.value;save()}});app.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.apptdone){const a=data.appointments.find(x=>x.id===t.dataset.apptdone);if(a)a.done=!a.done;save();render();return}if(t.dataset.apptdelete){if(confirm('Termin löschen?')){data.appointments=data.appointments.filter(x=>x.id!==t.dataset.apptdelete);save();render()}return}if(t.dataset.orderdone){const o=data.orders.find(x=>x.id===t.dataset.orderdone);if(o)o.done=!o.done;save();render();return}if(t.dataset.orderdelete){if(confirm('Auftrag löschen?')){data.orders=data.orders.filter(x=>x.id!==t.dataset.orderdelete);save();render()}return}if(t.dataset.open){openReport=t.dataset.open;page='reports';render();return}if(t.dataset.status){const i=t.dataset.item,v=data.draft.checks[i]||{};v.status=t.dataset.status;data.draft.checks[i]=v;save();render();return}if(t.dataset.removephoto){const v=data.draft.checks[t.dataset.removephoto];v.photos=photoList(v);delete v.photo;v.photos.splice(Number(t.dataset.photoindex),1);save();render();return}if(t.dataset.saveprop){const p=prop(t.dataset.saveprop);app.querySelectorAll(`[data-pid="${CSS.escape(p.id)}"]`).forEach(el=>p[el.dataset.field]=el.value);save();render();return}if(t.dataset.delprop){const id=t.dataset.delprop;if(data.reports.some(r=>r.propertyId===id)||data.draft?.propertyId===id)return alert('Zu diesem Objekt existieren Berichte oder ein Entwurf. Bitte diese zuerst entfernen.');if(confirm('Immobilie entfernen?')){data.properties=data.properties.filter(p=>p.id!==id);selected=data.properties[0]?.id||'';save();render()}return}if(t.dataset.delete){if(confirm('Diesen Bericht unwiderruflich löschen?')){data.reports=data.reports.filter(r=>r.id!==t.dataset.delete);openReport=null;save();render()}return}switch(t.dataset.action){case 'new':newDraft();break;case 'add-appointment':{const title=document.querySelector('#appointment-title').value.trim(),dateValue=document.querySelector('#appointment-date').value;if(!title||!dateValue)return alert('Bitte Titel und Datum eingeben.');data.appointments.push({id:uid(),propertyId:document.querySelector('#appointment-property').value,date:dateValue,time:document.querySelector('#appointment-time').value,title,notes:document.querySelector('#appointment-notes').value,done:false});save();render();break}case 'add-order':{const title=document.querySelector('#order-title').value.trim();if(!title)return alert('Bitte Auftrag benennen.');data.orders.push({id:uid(),propertyId:document.querySelector('#order-property').value,title,category:document.querySelector('#order-category').value,price:document.querySelector('#order-price').value,notes:document.querySelector('#order-notes').value,done:false});save();render();break}case 'add-property':{const name=document.querySelector('#new-name').value.trim(),location=document.querySelector('#new-location').value.trim();if(!name)return alert('Bitte einen Namen eingeben.');const p={id:uid(),name,location,owner:'',notes:''};data.properties.push(p);selected=p.id;save();render();break}case 'finish':{const r=data.draft;if(count(r)!==items.length)return alert('Bitte alle 16 Prüfpunkte bearbeiten.');if(items.some(i=>r.checks[i]?.status==='bad'&&!r.checks[i]?.note?.trim()))return alert('Bitte jeden Mangel beschreiben.');if(!confirm('Kontrollbericht abschließen und lokal speichern?'))return;const p=prop(r.propertyId);r.propertyName=p?.name||'';r.propertyLocation=p?.location||'';r.finishedAt=new Date().toISOString();data.reports.push(r);data.draft=null;openReport=r.id;save();page='reports';render();break}case 'discard':if(confirm('Entwurf wirklich verwerfen?')){data.draft=null;save();render()}break;case 'back-reports':openReport=null;render();break;case 'print':window.print();break;case 'text-export':{const r=data.reports.find(x=>x.id===openReport);download('Kontrollbericht-'+r.date+'.txt',textReport(r),'text/plain;charset=utf-8');break}case 'backup':download('FerienhausPilot-Backup-'+today()+'.json',JSON.stringify(data,null,2),'application/json');break;case 'reset':if(confirm('Wirklich ALLE lokalen Testdaten löschen?')&&confirm('Letzte Bestätigung: Daten unwiderruflich löschen?')){data=initial();selected='villa-lotta';openReport=null;save();page='dashboard';render()}break}});document.querySelector('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;openReport=null;render()});render()})();
</script></body></html>
